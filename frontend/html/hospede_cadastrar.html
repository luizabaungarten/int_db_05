        </nav>

    <main>
        <h1>Cadastrar Novo Hóspede</h1>
        <br><br>
        <form>
            <label for="nome">Nome do Hóspede</label><br>
            <input type="text" id="nome" placeholder="Ex: Luis" required><br><br>
            
            <label for="cpf">CPF do Hóspede</label><br>
            <input type="text" id="cpf" placeholder="Ex: 123.456.789-00" required><br><br>
            
            <label for="email">Email do Hóspede</label><br>
            <input type="email" id="email" placeholder="Ex: luis123@gmail.com" required><br><br>
            
            <label for="telefone">Telefone do Hóspede</label><br>
            <input type="text" id="telefone" placeholder="Ex: +55 (12) 9 4567-8912" required><br><br>
        </form>

        <div>
            <button id="btn_cadastrar">Cadastrar</button><br><br>
        </div>

    </main>

    <footer>
