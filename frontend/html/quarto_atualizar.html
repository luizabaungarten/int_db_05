<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>

            <span class="titulo_menu">Hóspedes</span>&emsp;

        </nav>

    <main>
        <h1>Atualizar Novo Quarto</h1>
        <br><br>
        <form>
            <label for="numeroQuarto">Novo Nome do Quarto</label><br>
            <input type="number" id="numeroQuarto" placeholder="Ex: 123" required><br><br>
            
            <label for="diasHospedagem">Novo Dias de hospedagem</label><br>
            <input type="number" id="diasHospedagem" placeholder="Ex: 1" required><br><br>
            
            <label for="valorDiaria">Novo Valor da diária (R$)</label><br>
            <input type="number" step="0.01" id="valorDiaria" required><br><br>
            
            <label for="idHospede">Novo Código do hóspede</label><br>
            <input type="number" id="idHospede" required><br><br>
        </form>

        <div>
            <button id="btn_atualizar">Atualizar</button><br><br>
        </div>

    </main>

    <div id="resposta" class="resposta"></div>
    
    <footer>

            by Luh &copy;
        </small>
    </footer>
